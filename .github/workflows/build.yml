name: Build Executables

on: [push, workflow_dispatch]

jobs:
    build:
        strategy:
            matrix:
                include:
                    # --- СБОРКА ДЛЯ WINDOWS ---
                    - os: windows-latest
                      artifact_name: Instally-Windows
                      build_cmd: poetry run pyinstaller --onefile --noconsole --name "Instally" --icon=./src/icon.ico --add-data "./src/icon.ico;." ./src/app/main.py
                      output_path: dist/Instally.exe

                    # --- СБОРКА ДЛЯ MACOS ---
                    - os: macos-latest
                      artifact_name: Instally-macOS
                      build_cmd: poetry run pyinstaller --windowed --name "Instally" --add-data "./src/icon.icns:." ./src/app/main.py
                      output_path: dist/Instally.app

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Poetry
              run: pip install poetry

            - name: Install dependencies
              run: poetry install

            - name: Build with PyInstaller
              run: ${{ matrix.build_cmd }}

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: ${{ matrix.output_path }}
